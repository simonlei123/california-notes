<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>加州主诉 California Notes｜美国住院医播客</title>
<meta name="description" content="《加州主诉》是一档中文访谈播客，聊一个人怎么走上美国住院医这条路，也聊 TA 在路上的风景。">
<meta property="og:title" content="加州主诉 California Notes｜美国住院医播客">
<meta property="og:image" content="https://simonlei123.github.io/california-notes/assets/cover.jpg">
<meta name="theme-color" content="#46435f">
<style>
  :root { --ink:#1d1b2a; --muted:#6e6a7c; --line:#ecebf0; }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body {
    min-height:100vh; color:#fff; background:#46435f;
    font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  /* The cover itself, blurred, fills the screen; a dusk tint keeps white text readable. */
  .backdrop { position:fixed; inset:-40px; z-index:-1;
    background:linear-gradient(180deg, rgba(40,36,62,.18), rgba(40,36,62,.55) 60%, rgba(35,32,52,.8)), url("assets/bg.jpg") center/cover; }
  .wechat { display:none; margin:0; padding:10px 16px; text-align:center; font-size:14px; line-height:1.5;
    color:var(--ink); background:rgba(255,255,255,.92); }
  .is-wechat .wechat { display:block; }
  main { max-width:440px; margin:0 auto; padding:36px 20px 28px; }
  .art { position:relative; width:min(300px, 78vw); margin:0 auto; }
  .art img { display:block; width:100%; height:auto; aspect-ratio:1; border-radius:14px; box-shadow:0 22px 50px rgba(20,16,36,.45); }
  .head { text-align:center; margin:22px 0 0; }
  h1 { margin:0; font-size:28px; line-height:1.3; font-weight:700; letter-spacing:1px; }
  .en { margin:2px 0 0; font-size:13px; font-weight:600; letter-spacing:3px; color:rgba(255,255,255,.7); }
  .intro { margin:14px auto 0; max-width:340px; font-size:14px; line-height:1.7; color:rgba(255,255,255,.8); }
  .contact { display:inline-flex; align-items:center; gap:8px; margin:12px 0 0; font-size:14px; color:rgba(255,255,255,.88); }
  .contact b { font-weight:600; letter-spacing:.5px; }
  .copy { border:0; padding:3px 10px; border-radius:999px; font:inherit; font-size:12px; color:#fff; background:rgba(255,255,255,.2); cursor:pointer; }
  .preview { display:inline-flex; align-items:center; gap:8px; margin:16px 0 0; padding:8px 16px 8px 10px;
    border:0; border-radius:999px; font:inherit; font-size:14px; font-weight:600; color:#fff;
    background:rgba(255,255,255,.18); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); cursor:pointer; }
  .preview .dot { display:grid; place-items:center; width:26px; height:26px; border-radius:50%; background:#fff; color:var(--ink); font-size:11px; }
  .preview .time { font-weight:400; color:rgba(255,255,255,.75); font-variant-numeric:tabular-nums; }
  .card { margin:24px 0 0; padding:4px 0; border-radius:16px; background:#fff; color:var(--ink);
    box-shadow:0 18px 40px rgba(20,16,36,.28); }
  .card a { display:flex; align-items:center; gap:14px; padding:12px 16px; color:inherit; text-decoration:none; }
  .card a + a { border-top:1px solid var(--line); }
  .card img { width:40px; height:40px; border-radius:10px; flex:none; }
  .card .name { flex:1; font-size:17px; font-weight:600; }
  .card .go { flex:none; padding:7px 16px; border-radius:999px; font-size:14px; font-weight:600; background:#f1f0f5; color:var(--ink); }
  .card a:active { background:#f7f6fa; }
  footer { margin:22px 0 0; text-align:center; font-size:12px; line-height:1.6; color:rgba(255,255,255,.6); }
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>
<p class="wechat" id="wechat">微信里打不开的话，点右上角「···」用浏览器打开</p>
<main>
  <div class="art"><img id="art" src="assets/cover.jpg" alt="《加州主诉》节目封面" width="1200" height="1200"></div>
  <div class="head">
    <h1>加州主诉</h1>
    <p class="en">CALIFORNIA NOTES · 美国住院医播客</p>
    <p class="intro">我们聊一个人怎么走上美国住院医这条路，也聊 TA 在路上的风景。记下彼此的成长，给未来的自己，也给后来的人留一点线索。</p>
    <p class="contact">联系微信：<b id="wxid">RM_CHN</b><button class="copy" id="copy" type="button">复制</button></p><br>
    <button class="preview" id="toggle" type="button" aria-label="播放预告">
      <span class="dot" id="icon" aria-hidden="true">▶</span>试听 EP01 <span class="time" id="time">1:07</span>
    </button>
    <audio id="audio" src="assets/preview.mp3" preload="metadata"></audio>
  </div>
  <nav class="card" id="platforms" aria-label="收听平台">
    <a href="https://www.xiaoyuzhoufm.com/podcast/6ae254c4e9aee6c3070aeb79"><img src="assets/logos/xiaoyuzhou.png" alt=""><span class="name">小宇宙</span><span class="go">收听</span></a>
    <a href="https://www.ximalaya.com/album/132591583"><img src="assets/logos/ximalaya.png" alt=""><span class="name">喜马拉雅</span><span class="go">收听</span></a>
    <a href="https://podcasts.apple.com/podcast/id6834220360"><img src="assets/logos/applepodcasts.png" alt=""><span class="name">Apple 播客</span><span class="go">收听</span></a>
    <a href="https://www.xiaohongshu.com/user/profile/682e2ce6000000000e01da89"><img src="assets/logos/xiaohongshu.png" alt=""><span class="name">小红书</span><span class="go">收听</span></a>
    <a href="https://open.spotify.com/show/4GUnmyfPoxccZYOZuDtlvA"><img src="assets/logos/spotify.png" alt=""><span class="name">Spotify</span><span class="go">收听</span></a>
  </nav>
  <footer>节目内容为嘉宾和主播的个人经历与看法，<br>不构成医疗、签证或申请建议。</footer>
</main>
<script>
  if (/MicroMessenger/i.test(navigator.userAgent)) document.documentElement.classList.add('is-wechat');
  const audio = document.getElementById('audio'), toggle = document.getElementById('toggle'),
        icon = document.getElementById('icon'), time = document.getElementById('time');
  const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  toggle.addEventListener('click', () => { audio.paused ? audio.play() : audio.pause(); });
  audio.addEventListener('play', () => { icon.textContent = '❚❚'; toggle.setAttribute('aria-label', '暂停预告'); });
  audio.addEventListener('pause', () => { icon.textContent = '▶'; toggle.setAttribute('aria-label', '播放预告'); });
  audio.addEventListener('timeupdate', () => { time.textContent = fmt(Math.max(0, (audio.duration || 67) - audio.currentTime)); });
  document.getElementById('copy').addEventListener('click', async e => {
    const id = document.getElementById('wxid').textContent, btn = e.currentTarget;
    try { await navigator.clipboard.writeText(id); btn.textContent = '已复制'; }
    catch { const r = document.createRange(); r.selectNodeContents(document.getElementById('wxid'));
            getSelection().removeAllRanges(); getSelection().addRange(r); btn.textContent = '长按复制'; }
    setTimeout(() => { btn.textContent = '复制'; }, 2000);
  });
  audio.addEventListener('ended', () => { audio.currentTime = 0; time.textContent = '1:07'; });
</script>
</body>
</html>
